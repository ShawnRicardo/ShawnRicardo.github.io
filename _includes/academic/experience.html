<section id="experiences" class="card border-0 shadow-sm bg-white mt-3" aria-label="Education and honors">
  <div class="card-body p-4">
    <div class="row">
      <div class="col-lg-6 mb-4 mb-lg-0" id="education">
        <h2 class="h6 mb-3"><i class="fas fa-graduation-cap mr-1" aria-hidden="true"></i> Education</h2>
        <ul class="list-unstyled mb-0 education-list">
          {% for item in site.data.homepage.education %}
          <li{% unless forloop.last %} class="mb-3"{% endunless %}>
            <div>{{ item.name }}</div>
            <div class="small text-muted">{{ item.department }}</div>
            <div class="small d-flex flex-wrap justify-content-between">
              <span class="mr-2">{{ item.position }}</span>
              <span class="text-muted"><em>{{ item.date }}</em></span>
            </div>
          </li>
          {% endfor %}
        </ul>
      </div>
      <div class="col-lg-6" id="awards">
        <h2 class="h6 mb-3"><i class="fas fa-award mr-1" aria-hidden="true"></i> Honors &amp; Awards</h2>
        <ul class="small pl-3 mb-0 awards-list">
          {% for item in site.data.homepage.awards %}
          <li{% unless forloop.last %} class="mb-2"{% endunless %}>{{ item.name }} <span class="text-muted">({{ item.date }})</span></li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</section>
