<!doctype html>
<html lang="{{ site.locale | default: 'en-US' }}">
<!-- Adapted from luost26/academic-homepage, default Home layout (MIT). -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include seo.html %}
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">
  <link rel="manifest" href="{{ '/images/manifest.json' | relative_url }}">
  <meta name="theme-color" content="#f8f9fa">
  <link rel="stylesheet" href="{{ '/assets/css/academicons.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academic-homepage/bootstrap.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academic-homepage/fontawesome.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academic-homepage/global.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/academic-homepage/personal.css' | relative_url }}">
  <script src="{{ '/assets/academic-homepage/navigation.js' | relative_url }}" defer></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100 academic-home">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="navbar navbar-expand-sm navbar-light fixed-top shadow-sm" aria-label="Main navigation">
    <div class="container-lg">
      <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>{{ site.name }}</strong></a>
      <button class="navbar-toggler" type="button" data-menu-toggle aria-controls="homepage-navigation" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fas fa-bars" aria-hidden="true"></i> <span class="small">Menu</span>
      </button>
      <div class="collapse navbar-collapse" id="homepage-navigation">
        <ul class="navbar-nav ml-auto">
          {% for item in site.data.navigation.pages %}
          <li class="nav-item{% if item.name == page.navbar_title %} active{% endif %}">
            <a class="nav-link" href="{{ item.url | relative_url }}"{% if item.name == page.navbar_title %} aria-current="page"{% endif %}{% if item.name == 'CV' %} target="_blank" rel="noopener noreferrer"{% endif %}>{{ item.name }}</a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </nav>
  <main id="main-content" class="container-lg flex-grow-1 flex-shrink-0">
    {{ content }}
  </main>
  <footer class="footer flex-shrink-0 border-top py-2 mt-5 bg-white small">
    <div class="container-lg d-flex flex-wrap justify-content-between py-3 text-muted">
      <div>© {{ 'now' | date: '%Y' }} {{ site.name }} · <i>Last updated: {{ 'now' | date: '%b %Y' }}</i></div>
      <a href="https://github.com/luost26/academic-homepage" target="_blank" rel="noopener noreferrer"><i class="fas fa-pencil-ruler" aria-hidden="true"></i> academic-homepage</a>
    </div>
  </footer>
</body>
</html>
